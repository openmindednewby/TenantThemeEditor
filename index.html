<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tenant Theme Editor</title>
    <meta name="description" content="Visual theme editor for tenant white-label customization" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html {
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      body { margin: 0; background-color: #f8fafc; color: #0f172a; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 3px solid #d1d5db;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>
      <div style="padding: 2rem; text-align: center;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use this application.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
